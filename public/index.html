<!DOCTYPE html>
<html lang="en" dir="ltr" id="rootHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>/* critical: prevent hero flash before CSS loads */.hero-video{min-height:440px;background:#0A1F44 url('hero-golden-poster.jpg') center/cover no-repeat}.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}@media(max-width:760px){.hero-video{min-height:380px}}</style>
<title>Fakhta — Online Store | فاختہ آن لائن اسٹور</title>
<meta name="description" content="Fakhta online store — Khubsurti, ab aap ke ghar tak. Premium dinner sets, crockery & more. Cash on Delivery across Pakistan.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1F44">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" data-nav>
      <img src="logo.png" alt="Fakhta" class="brand-logo">
      <span class="brand-text"><span class="brand-name">FAKHTA</span><span class="brand-ur">فاختہ</span></span>
    </a>
    <nav class="topnav" id="topnav">
      <a href="#/" data-nav data-i18n="nav_home">Home</a>
      <a href="#/shop" data-nav data-i18n="nav_shop">Shop</a>
      <a href="#/track" data-nav data-i18n="nav_track">Track Order</a>
    </nav>
    <div class="topbar-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Language">اردو</button>
      <button class="icon-btn cart-btn" id="cartOpen" aria-label="Cart">🛒<span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main id="view"></main>

<footer>
  <div class="footer-grid">
    <div class="footer-col">
      <img src="logo.png" alt="Fakhta" class="footer-logo">
      <p class="footer-slogan" data-i18n="slogan">Khubsurti, ab aap ke ghar tak</p>
      <p class="footer-slogan2">Premium Living, Delivered</p>
    </div>
    <div class="footer-col">
      <h4 data-i18n="ft_shop">Shop</h4>
      <div id="footerCats"></div>
    </div>
    <div class="footer-col">
      <h4 data-i18n="ft_support">Support</h4>
      <a href="#/track" data-nav data-i18n="nav_track">Track Order</a>
      <span data-i18n="ft_cod">Cash on Delivery</span>
      <span data-i18n="ft_returns">7-Day Easy Returns</span>
      <a id="storeWa" style="display:none" target="_blank" rel="noopener" href="#" onclick="this.href=waLink('Assalam-o-Alaikum! Mujhe Fakhta store se maloomat chahiye.')||'#';return !!STORE.whatsapp">📱 WhatsApp: <span dir="ltr"></span></a>
      <a href="https://www.daraz.pk/shop/kashf-mart" target="_blank" rel="noopener">🛒 Daraz Shop: Tayoor Al-Jannah</a>
    </div>
  </div>
  <div class="footer-bottom">© 2026 Fakhta • <span data-i18n="ft_rights">All Rights Reserved</span></div>
</footer>

<nav id="bottomnav">
  <a href="#/" data-nav data-view="home"><span class="bn-ico">🏠</span><span data-i18n="nav_home">Home</span></a>
  <a href="#/shop" data-nav data-view="shop"><span class="bn-ico">🛍️</span><span data-i18n="nav_shop">Shop</span></a>
  <a href="#/track" data-nav data-view="track"><span class="bn-ico">📦</span><span data-i18n="nav_track">Track</span></a>
  <a href="#" id="bnCart"><span class="bn-ico">🛒</span><span data-i18n="nav_cart">Cart</span></a>
</nav>

<div id="cartDrawer" class="drawer">
  <div class="drawer-head"><h3 data-i18n="cart_title">Shopping Cart</h3><button class="icon-btn" id="cartClose">✕</button></div>
  <div id="cartItems" class="drawer-body"></div>
  <div class="drawer-foot">
    <div class="cart-total"><span data-i18n="cart_total">Total</span><b id="cartTotal">Rs. 0</b></div>
    <button class="btn-gold btn-block" id="checkoutBtn" data-i18n="cart_checkout">Checkout</button>
  </div>
</div>
<div id="drawerScrim"></div>
<div id="toast"></div>

<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
